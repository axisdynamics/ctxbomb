# Sitio "de producción" de ejemplo. La única línea de ctxbomb es el include.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/ctxbomb/ctxbomb-server.conf;
    location = /api/health { return 200 'ok-real-site'; }
    location / { try_files $uri $uri/ =404; }
}
