# Demo: nginx + sitio de ejemplo + ctxbomb.
# Antes:  python -m ctxbomb nginx -c config/nginx.example.json -o docker/nginx-demo/out
# Luego:  docker compose -f docker/nginx-demo/docker-compose.yml up -d
services:
  web:
    image: nginx:alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./out/ctxbomb-http.conf:/etc/nginx/conf.d/00-ctxbomb-http.conf:ro
      - ./out/ctxbomb-server.conf:/etc/nginx/ctxbomb/ctxbomb-server.conf:ro
      - ./out/www:/etc/ctxbomb/www:ro
      - ./site/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site/index.html:/usr/share/nginx/html/index.html:ro
      - ./logs:/var/log/nginx
